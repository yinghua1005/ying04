<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InBody 計算器</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <main class="mx-auto max-w-3xl px-4 py-8">
    <section class="rounded-2xl bg-white p-6 shadow-lg">
      <h1 class="text-2xl font-bold">InBody 計算器</h1>
      <p class="mt-2 text-sm text-slate-600">輸入資料後可計算 BMI、BMR、TDEE。</p>

      <div class="mt-6 grid grid-cols-1 gap-4 md:grid-cols-2">
        <label class="block">
          <span class="mb-1 block text-sm font-medium">身高 (cm)</span>
          <input id="heightCm" type="number" step="0.1" min="0" class="w-full rounded-lg border border-slate-300 px-3 py-2" />
          <p id="heightCmError" class="mt-1 text-xs text-red-600"></p>
        </label>

        <label class="block">
          <span class="mb-1 block text-sm font-medium">體重 (kg)</span>
          <input id="weightKg" type="number" step="0.1" min="0" class="w-full rounded-lg border border-slate-300 px-3 py-2" />
          <p id="weightKgError" class="mt-1 text-xs text-red-600"></p>
        </label>

        <label class="block">
          <span class="mb-1 block text-sm font-medium">年齡</span>
          <input id="age" type="number" step="1" min="1" max="120" class="w-full rounded-lg border border-slate-300 px-3 py-2" />
          <p id="ageError" class="mt-1 text-xs text-red-600"></p>
        </label>

        <label class="block">
          <span class="mb-1 block text-sm font-medium">性別</span>
          <select id="gender" class="w-full rounded-lg border border-slate-300 px-3 py-2">
            <option value="">請選擇</option>
            <option value="Male">男</option>
            <option value="Female">女</option>
          </select>
          <p id="genderError" class="mt-1 text-xs text-red-600"></p>
        </label>

        <label class="block md:col-span-2">
          <span class="mb-1 block text-sm font-medium">活動量</span>
          <select id="activityLevel" class="w-full rounded-lg border border-slate-300 px-3 py-2">
            <option value="">請選擇</option>
            <option value="Sedentary">久坐</option>
            <option value="Light">輕量活動</option>
            <option value="Moderate">中量活動</option>
            <option value="High">高量活動</option>
            <option value="VeryHigh">非常高量活動</option>
          </select>
          <p id="activityLevelError" class="mt-1 text-xs text-red-600"></p>
        </label>
      </div>

      <div class="mt-6 flex flex-wrap gap-3">
        <button id="bmiButton" class="rounded-lg bg-sky-600 px-4 py-2 font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-300" disabled>
          計算 BMI
        </button>
        <button id="bmrButton" class="rounded-lg bg-emerald-600 px-4 py-2 font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-300" disabled>
          計算 BMR
        </button>
        <button id="tdeeButton" class="rounded-lg bg-amber-600 px-4 py-2 font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-300" disabled>
          計算 TDEE
        </button>
      </div>

      <section class="mt-6 rounded-lg bg-slate-50 p-4">
        <h2 class="text-sm font-semibold text-slate-700">結果</h2>
        <p id="resultText" class="mt-2 text-base">尚未計算。</p>
        <p id="apiErrorText" class="mt-2 text-sm text-red-600"></p>
      </section>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
